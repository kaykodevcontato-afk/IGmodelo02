<!-- MODELO PARA NOVO AVISO / EVENTO
     PASSO 1: No início do index.html, em 📸 FOTOS DO SITE, acrescente:
               "novo_evento": "MinhaFotoDoEvento.jpg"
             Lembre-se de colocar uma vírgula após a linha anterior do JSON.
     PASSO 2: Copie o artigo completo abaixo para dentro de <div class="avisos-grid">.
     PASSO 3: Atualize título, data, texto e, se desejar, o identificador novo_evento.
     Não é necessário escrever o nome da foto em dois lugares.
-->
<article class="aviso-card">
    <div class="aviso-card-img" data-lightbox-foto="novo_evento" data-alt="Foto do novo evento"
         role="button" tabindex="0" aria-label="Ampliar foto do novo evento">
        <img data-foto="novo_evento" alt="Foto do novo evento" loading="lazy">
        <span class="aviso-tag tag-evento"><i class="fas fa-calendar-alt" aria-hidden="true"></i> Evento</span>
        <span class="zoom-hint"><i class="fas fa-search-plus" aria-hidden="true"></i></span>
    </div>
    <div class="aviso-card-corpo">
        <span class="aviso-data"><i class="far fa-calendar" aria-hidden="true"></i> DATA DO EVENTO</span>
        <h4>TÍTULO DO NOVO EVENTO</h4>
        <p>Coloque uma descrição do evento, horário e local.</p>
    </div>
</article>
