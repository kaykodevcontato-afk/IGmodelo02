<!-- MODELO DE NOVO AVISO: copie o artigo inteiro para dentro de <div class="avisos-grid"> no index.html. -->
<article class="aviso-card">
    <!-- Troque FOTO-DO-EVENTO.jpg nos dois pontos abaixo, pelo MESMO nome. -->
    <div class="aviso-card-img" data-lightbox="FOTO-DO-EVENTO.jpg" data-alt="Descrição da foto" role="button" tabindex="0" aria-label="Ampliar foto do evento">
        <img src="FOTO-DO-EVENTO.jpg" alt="Descrição da foto" loading="lazy">
        <span class="aviso-tag tag-evento"><i class="fas fa-calendar-alt" aria-hidden="true"></i> Evento</span>
        <span class="zoom-hint"><i class="fas fa-search-plus" aria-hidden="true"></i></span>
    </div>
    <div class="aviso-card-corpo">
        <span class="aviso-data"><i class="far fa-calendar" aria-hidden="true"></i> DIA E MÊS</span>
        <h4>TÍTULO DO NOVO EVENTO</h4>
        <p>Descreva o evento em uma ou duas frases. Inclua horário e local, se necessário.</p>
    </div>
</article>
